name: ci
on: [push, pull_request]
jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: self-test (must include cases that go red)
        run: python3 pakdrift.py --self-test
      - name: version
        run: python3 pakdrift.py --version
